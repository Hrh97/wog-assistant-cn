name: publish release from CHANGELOG
on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create release for latest CHANGELOG version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "latest version tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, nothing to do"
            exit 0
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG not found in repo, skip"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          echo "release $TAG created"
